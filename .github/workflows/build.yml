name: Build, test and package
on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'arcade/**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
env:
  # Windows runners default Python to cp1252; the docs and sheets are UTF-8.
  PYTHONUTF8: '1'
concurrency:
  group: build-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - os: windows-2022
            qt_arch: win64_msvc2022_64
          - os: macos-14
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        # Pin the built Node action directly so its composite wrapper cannot
        # introduce a nested floating @v4 dependency.
        uses: jurplel/install-qt-action/action@12aa0336e1e410b3c6dff5e0722547f7a37e8c60 # v4.2.1
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          # QtSvg ships in the essentials; it is not a selectable aqt addon.
          modules: qtimageformats
          cache: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build patchelf desktop-file-utils xvfb xauth xdotool libx11-dev libxkbcommon-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-image0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Windows build tools
        if: runner.os == 'Windows'
        run: choco install ninja nsis --no-progress -y
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Version
        id: version
        shell: bash
        # CMakeLists.txt is the one place the version is written.
        run: echo "value=$(sed -nE 's/^project\(ArcadeShelf VERSION ([^ ]+).*/\1/p' CMakeLists.txt)" >> "$GITHUB_OUTPUT"
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Check immutable vendor source
        run: python scripts/check-vendor.py
      - name: Validate shortcut data and generated sheet
        run: python scripts/check-shortcuts.py
      - name: Validate local documentation links
        run: python scripts/check-doc-links.py
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ctest --test-dir build --output-on-failure
      - name: Release metadata generator tests
        run: python scripts/test_arcade_release.py
      - name: Linux X11 and AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
          QT_QUICK_BACKEND: software
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          xvfb-run -a ctest --test-dir build --output-on-failure
          python scripts/package-linux.py --build build --qt-prefix "$QT_ROOT_DIR" --version "$VERSION" --output dist
          # The AppImage runtime is a parent process, so the Link process
          # tests drive the exact payload it carries.
          mkdir package-smoke && cd package-smoke
          APPIMAGE_EXTRACT_AND_RUN=1 "../dist/Arcade-Shelf-$VERSION-x86_64.AppImage" --appimage-extract >/dev/null
          cd ..
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH QT_QPA_PLATFORM=offscreen python tests/process_smoke.py --binary package-smoke/squashfs-root/usr/bin/arcade-shelf
          # And the real GL path: show the window under Xvfb (Mesa llvmpipe)
          # with no backend override; it must still be running, then quit.
          export APP="$PWD/dist/Arcade-Shelf-$VERSION-x86_64.AppImage" APPIMAGE_EXTRACT_AND_RUN=1 \
            HOME="$RUNNER_TEMP/gl-home" XDG_DATA_HOME="$RUNNER_TEMP/gl-data" XDG_CONFIG_HOME="$RUNNER_TEMP/gl-config" XDG_CACHE_HOME="$RUNNER_TEMP/gl-cache" \
            ARCADE_SHELF_HOME="$RUNNER_TEMP/gl-profile" ARCADE_HOME="$RUNNER_TEMP/gl-arcade" ARCADE_NO_INSTALL_PROMPT=1 ARCADE_SHELF_ALLOW_DESKTOP_IN_TESTS=1
          env -u QT_QUICK_BACKEND -u LD_LIBRARY_PATH xvfb-run -a sh -c '"$APP" --show & pid=$!; sleep 4; kill -0 $pid && "$APP" --quit && wait $pid'
      - name: Linux AppImage installer lifecycle (isolated, CI only)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: dbus-run-session -- python3 tests/appimage_lifecycle.py --appimage "dist/Arcade-Shelf-$VERSION-x86_64.AppImage"
      - name: Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/package-windows.ps1 -Build build -QtPrefix $env:QT_ROOT_DIR -Version ${{ steps.version.outputs.value }} -Output dist
      - name: Windows silent installer lifecycle (isolated, CI only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-windows-installer.ps1 -Version ${{ steps.version.outputs.value }} -Output dist
      - name: macOS package
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh build ${{ steps.version.outputs.value }} dist
      - name: macOS bundle lifecycle (isolated, CI only)
        if: runner.os == 'macOS'
        run: sh scripts/test-macos-installer.sh ${{ steps.version.outputs.value }} dist
      - name: Generate release manifests
        run: python scripts/arcade-release.py --id arcade.shelf --version ${{ steps.version.outputs.value }} --channel nightly --notes https://github.com/qa-p1/Arcade-Shelf/blob/${{ github.event.pull_request.head.sha || github.sha }}/CHANGELOG.md dist
      - name: Report bounded failure diagnostics
        if: failure()
        run: python scripts/ci-diagnostics.py --build build
      - name: Upload development artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Arcade-Shelf-${{ matrix.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  # A version tag publishes the three packages (Linux AppImage, Windows
  # installer, macOS disk image) as a GitHub release with one
  # stable arcade-release.json and SHA256SUMS.txt, which Arcade Tools installs.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Arcade-Shelf-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -nE 's/^project\(ArcadeShelf VERSION ([^ ]+).*/\1/p' CMakeLists.txt)
          test "$GITHUB_REF_NAME" = "v$v" || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
          rm -f dist/arcade-release.json dist/SHA256SUMS.txt
          python scripts/arcade-release.py --id arcade.shelf --version "$v" --channel stable \
            --notes "https://github.com/qa-p1/Arcade-Shelf/blob/$GITHUB_REF_NAME/CHANGELOG.md" dist
          python3 scripts/release-notes.py CHANGELOG.md "$v" > notes.md
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/*.AppImage dist/*.exe dist/*.dmg dist/arcade-release.json dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Arcade Shelf $v" --notes-file notes.md
