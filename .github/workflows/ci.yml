# Checks, tests and installers on Linux, Windows and macOS. Packages and a
# nightly arcade-release.json are workflow artifacts; releases are published
# only by release.yml, which calls this workflow (see tag.yml for the order).
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
env:
  # Windows runners default Python to cp1252; the docs and sheets are UTF-8.
  PYTHONUTF8: '1'
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Shelf's only package-manager dependencies are GitHub Actions (Qt is pinned above and Link is vendored, see
  # SECURITY.md); a pull request that adds or bumps one with a known advisory fails here. Dependabot keeps them current.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt_arch: linux_gcc_64
          - os: windows-2022
            qt_arch: win64_msvc2022_64
          - os: macos-15
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        # Pin the built Node action directly so its composite wrapper cannot
        # introduce a nested floating @v4 dependency.
        uses: jurplel/install-qt-action/action@12aa0336e1e410b3c6dff5e0722547f7a37e8c60 # v4.2.1
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          # QtSvg ships in the essentials; it is not a selectable aqt addon.
          modules: qtimageformats
          cache: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-format-18 xvfb xauth xdotool libx11-dev libxkbcommon-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-image0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Windows build tools
        if: runner.os == 'Windows'
        run: choco install ninja --no-progress -y
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=('-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' '-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0')
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DSHELF_WARNINGS_AS_ERRORS=ON "${args[@]}"
      # Format, qmllint, vendored files, docs, shortcut data, release tools and
      # every test: exactly what a contributor runs locally.
      - name: scripts/check
        run: python scripts/check.py --build build
      - name: Linux X11
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: xcb
          QT_QUICK_BACKEND: software
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Report bounded failure diagnostics
        if: failure()
        run: python scripts/ci-diagnostics.py --build build

  package:
    name: package (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # The AppImage bundles libraries from the build host, so it is built on the oldest supported Ubuntu
          # (package-linux.py). 0.4.0 was built on 24.04 and needs glibc 2.38; this one starts on 22.04 and later,
          # which Link's gates also need (their Linux job runs the published AppImage on 22.04).
          - os: ubuntu-22.04
            name: linux-x64
            qt_arch: linux_gcc_64
          - os: windows-2022
            name: windows-x64
            qt_arch: win64_msvc2022_64
          - os: macos-15
            name: macos-universal
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt
        uses: jurplel/install-qt-action/action@12aa0336e1e410b3c6dff5e0722547f7a37e8c60 # v4.2.1
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          modules: qtimageformats
          cache: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: sudo apt-get update && sudo apt-get install -y ninja-build patchelf desktop-file-utils xvfb xauth xdotool libx11-dev libxkbcommon-dev libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-image0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Windows build tools
        if: runner.os == 'Windows'
        run: choco install ninja nsis --no-progress -y
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Version
        id: version
        shell: bash
        run: echo "value=$(python scripts/check-version.py)" >> "$GITHUB_OUTPUT"
      - name: Build
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=('-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' '-DCMAKE_OSX_DEPLOYMENT_TARGET=13.0')
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF "${args[@]}"
          cmake --build build --parallel 2
      - name: Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          python scripts/package-linux.py --build build --qt-prefix "$QT_ROOT_DIR" --version "$VERSION" --output dist
          # The AppImage runtime is a parent process, so the Link process
          # tests drive the exact payload it carries.
          mkdir package-smoke && cd package-smoke
          APPIMAGE_EXTRACT_AND_RUN=1 "../dist/Arcade-Shelf-$VERSION-x86_64.AppImage" --appimage-extract >/dev/null
          cd ..
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH QT_QPA_PLATFORM=offscreen python tests/process_smoke.py --binary package-smoke/squashfs-root/usr/bin/arcade-shelf
          # And the real GL path: show the window under Xvfb (Mesa llvmpipe)
          # with no backend override. The launcher hands over to the unpacked
          # copy under <data>/arcade/runtime and exits 0 (U1), so the test
          # follows the resident: where it runs from, that it stays up, that
          # --status and --quit reach it, and that nothing of the runtime is left.
          env -u QT_QUICK_BACKEND -u LD_LIBRARY_PATH xvfb-run -a python3 tests/appimage_resident.py --appimage "dist/Arcade-Shelf-$VERSION-x86_64.AppImage"
      - name: Linux AppImage installer lifecycle (isolated, CI only)
        if: runner.os == 'Linux'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: dbus-run-session -- python3 tests/appimage_lifecycle.py --appimage "dist/Arcade-Shelf-$VERSION-x86_64.AppImage"
      - name: Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/package-windows.ps1 -Build build -QtPrefix $env:QT_ROOT_DIR -Version ${{ steps.version.outputs.value }} -Output dist
      - name: Windows silent installer lifecycle (isolated, CI only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-windows-installer.ps1 -Version ${{ steps.version.outputs.value }} -Output dist
      - name: macOS package
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh build ${{ steps.version.outputs.value }} dist universal
      - name: macOS bundle lifecycle (isolated, CI only)
        if: runner.os == 'macOS'
        run: sh scripts/test-macos-installer.sh ${{ steps.version.outputs.value }} dist
      - name: Report bounded failure diagnostics
        if: failure()
        run: python scripts/ci-diagnostics.py --build build
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: |
            dist/*.AppImage
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  # Tier 1: the panel, capsule and Settings on headless Hyprland (Link's desktop harness), from the AppImage built
  # above; Tier 2: start, --status, tray and quit on sway, KWin, Mutter and X11.
  desktop:
    needs: package
    uses: qa-p1/Arcade-Link/.github/workflows/desktop-e2e.yml@v1.0.13
    with:
      name: shelf
      test: tests/desktop/shelf_desktop.py
      args: '"$APP"'
      artifact: package-linux-x64
      link-ref: v1.0.13
  desktop-tier2:
    needs: package
    uses: qa-p1/Arcade-Link/.github/workflows/desktop-tier2.yml@v1.0.13
    with:
      artifact: package-linux-x64
      link-ref: v1.0.13

  # The three installers together, as one release would carry them.
  manifest:
    name: arcade-release.json
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Generate and check the nightly manifest
        run: |
          python3 scripts/arcade-release.py --id arcade.shelf --version "$(python3 scripts/check-version.py)" --channel nightly \
            --notes "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/CHANGELOG.md" dist
          ls -l dist
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: |
            dist/arcade-release.json
            dist/SHA256SUMS.txt
          retention-days: 14
