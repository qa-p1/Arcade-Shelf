# Builds, tests and publishes a release through ci.yml. Beta is a private
# draft prerelease (the rehearsal); stable must run on its v<version> tag,
# created by tag.yml. Tools installs stable releases through
# arcade-release.json and SHA256SUMS.txt.
name: Release
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        options: [beta, stable]
        default: beta
      draft:
        description: Keep the release as a private draft
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate channel, version and publication intent
        id: plan
        env:
          CHANNEL: ${{ inputs.channel }}
          DRAFT: ${{ inputs.draft }}
        run: |
          version=$(python3 scripts/check-version.py)
          if [ "$CHANNEL" = stable ]; then
            [ "$GITHUB_REF" = "refs/tags/v$version" ] || { echo "Stable releases must run on v$version"; exit 1; }
            tag="v$version"
          else
            [ "$DRAFT" = true ] || { echo "Beta verification is draft-only"; exit 1; }
            tag="v$version-beta.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  ci:
    needs: prepare
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [prepare, ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      CHANNEL: ${{ inputs.channel }}
      DRAFT: ${{ inputs.draft }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Release metadata
        run: |
          version=$(python3 scripts/check-version.py)
          # Tools has stable and nightly channels; a beta draft is checked as nightly.
          manifest_channel=$([ "$CHANNEL" = stable ] && echo stable || echo nightly)
          python3 scripts/arcade-release.py --id arcade.shelf --version "$version" --channel "$manifest_channel" \
            --notes "https://github.com/$GH_REPO/blob/$TAG/CHANGELOG.md" dist
          (cd dist && sha256sum -c SHA256SUMS.txt)
          python3 scripts/release-notes.py CHANGELOG.md "$version" > notes.md
          printf '\nUser guide: https://github.com/%s/tree/main/docs/user\n' "$GH_REPO" >> notes.md
          ls -l dist
      - name: Publish the requested release
        run: |
          assets=(dist/*.AppImage dist/*.exe dist/*.dmg dist/arcade-release.json dist/SHA256SUMS.txt)
          if [ "$DRAFT" = true ]; then
            flags=()
            [ "$CHANNEL" = stable ] || flags+=(--prerelease)
            gh release create "$TAG" "${assets[@]}" --draft "${flags[@]}" --target "$GITHUB_SHA" --title "Arcade Shelf $TAG" --notes-file notes.md
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --latest --title "Arcade Shelf ${TAG#v}" --notes-file notes.md
          fi
