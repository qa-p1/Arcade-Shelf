# Weekly, one grouped pull request for minor and patch updates (majors stay separate), and no automatic rebase:
# each rebase started a full CI build per open pull request whenever main moved, which queued release work behind
# them. Ask "@dependabot rebase" on a pull request to refresh it. Qt (pinned in ci.yml) and the vendored Arcade
# Link (VENDORED.md) are updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    rebase-strategy: disabled
    groups:
      actions: { update-types: [minor, patch] }
